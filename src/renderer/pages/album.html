<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光纪念册 - 相册</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    /* 导航栏 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      padding: 0 30px;
      z-index: 100;
    }

    .navbar-logo {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .navbar-logo-icon {
      font-size: 28px;
      animation: heartBeat 2s ease-in-out infinite;
    }

    .navbar-nav {
      display: flex;
      gap: 8px;
      margin-left: 50px;
      flex: 1;
    }

    .nav-item {
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-item:hover {
      background: var(--bg-gradient-start);
      color: var(--primary);
    }

    .nav-item.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--bg-gradient-start);
      cursor: pointer;
      font-size: 18px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: var(--primary-light);
      color: white;
      transform: scale(1.1);
    }

    /* 主内容区 */
    .main-content {
      padding-top: 80px;
      padding-bottom: 40px;
      max-width: 1400px;
      margin: 0 auto;
      padding-left: 30px;
      padding-right: 30px;
    }

    /* 页面标题 */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-actions {
      display: flex;
      gap: 12px;
    }

    /* 相册分类标签 */
    .album-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      padding: 16px 20px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
    }

    .album-tab {
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: var(--transition);
      font-size: 14px;
      background: var(--bg-gradient-start);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .album-tab:hover {
      background: var(--primary-light);
      color: white;
    }

    .album-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
    }

    .album-tab-count {
      font-size: 12px;
      opacity: 0.8;
    }

    .album-tab-add {
      border: 2px dashed var(--primary-light);
      background: transparent;
      color: var(--primary);
    }

    .album-tab-add:hover {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    /* 照片瀑布流网格 */
    .photo-grid {
      /* 默认为普通容器，有照片时通过 .masonry 激活瀑布流 */
    }

    .photo-grid.masonry {
      columns: 4;
      column-gap: 16px;
    }

    @media (max-width: 1200px) {
      .photo-grid.masonry { columns: 3; }
    }

    @media (max-width: 800px) {
      .photo-grid.masonry { columns: 2; }
    }

    .photo-item {
      break-inside: avoid;
      margin-bottom: 16px;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
      background: #f5f5f5;
    }

    .photo-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .photo-item img,
    .photo-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-item .video-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .photo-item .photo-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 12px 12px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      color: white;
      opacity: 0;
      transition: var(--transition);
    }

    .photo-item:hover .photo-overlay {
      opacity: 1;
    }

    .photo-note {
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 8px;
    }

    .photo-date {
      font-size: 11px;
      opacity: 0.8;
    }

    .photo-delete-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 107, 107, 0.9);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      opacity: 0;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-item:hover .photo-delete-btn {
      opacity: 1;
    }

    .photo-delete-btn:hover {
      background: #ff6b6b;
      transform: scale(1.1);
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-light);
    }

    .empty-state-icon {
      font-size: 80px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 18px;
      margin-bottom: 24px;
    }

    /* 图片查看器模态框 */
    .viewer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .viewer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .viewer-content {
      max-width: 90vw;
      max-height: 85vh;
      position: relative;
    }

    .viewer-content img,
    .viewer-content video {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .viewer-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: white;
      font-size: 32px;
      cursor: pointer;
      transition: var(--transition);
    }

    .viewer-close:hover {
      transform: rotate(90deg);
    }

    .viewer-info {
      position: absolute;
      bottom: -50px;
      left: 0;
      right: 0;
      color: white;
      text-align: center;
      font-size: 14px;
      opacity: 0.8;
    }

    .viewer-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer-nav:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .viewer-prev {
      left: -70px;
    }

    .viewer-next {
      right: -70px;
    }

    /* 上传区域 */
    .upload-zone {
      border: 3px dashed var(--primary-light);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: rgba(255, 255, 255, 0.5);
      margin-bottom: 24px;
    }

    .upload-zone:hover {
      border-color: var(--primary);
      background: var(--bg-gradient-start);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .upload-text {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .upload-hint {
      font-size: 13px;
      color: var(--text-light);
    }

    /* 幻灯片按钮 */
    .slideshow-btn {
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-logo">
      <span class="navbar-logo-icon">💝</span>
      时光纪念册
    </div>
    <div class="navbar-nav">
      <div class="nav-item" onclick="navigateTo('index.html')">
        <span>🏠</span> 首页
      </div>
      <div class="nav-item" onclick="navigateTo('diary.html')">
        <span>📖</span> 日记
      </div>
      <div class="nav-item active" onclick="navigateTo('album.html')">
        <span>📸</span> 相册
      </div>
      <div class="nav-item" onclick="navigateTo('chat.html')">
        <span>💬</span> 聊天记录
      </div>
      <div class="nav-item nav-dropdown">
        <span>📤</span> 导出方法
        <div class="nav-dropdown-menu">
          <div class="nav-dropdown-item" onclick="navigateTo('export-guide.html?platform=wechat')">
            💬 微信
          </div>
          <div class="nav-dropdown-item" onclick="navigateTo('export-guide.html?platform=qq')">
            🐧 QQ
          </div>
          <div class="nav-dropdown-item" onclick="navigateTo('export-guide.html?platform=douyin')">
            🎵 抖音
          </div>
        </div>
      </div>
      <div class="nav-item" onclick="navigateTo('guide.html')">
        <span>📖</span> 使用说明
      </div>
      <div class="nav-item" onclick="navigateTo('settings.html')">
        <span>⚙️</span> 设置
      </div>
    </div>
    <div class="navbar-right">
      <button class="icon-btn" title="幻灯片播放" onclick="startSlideshow()">🎬</button>
      <button class="icon-btn" title="锁定" onclick="lockApp()">🔒</button>
    </div>
  </nav>

  <!-- 主内容 -->
  <div class="main-content">
    <div class="page-header">
      <div class="page-title">
        📸 情侣相册
        <span style="font-size: 14px; font-weight: 400; color: var(--text-light);" id="photoCount">共 0 张</span>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary" onclick="uploadPhotos()">
          📷 上传照片
        </button>
        <button class="btn btn-secondary" onclick="uploadVideos()">
          🎬 上传视频
        </button>
      </div>
    </div>

    <!-- 相册分类 -->
    <div class="album-tabs" id="albumTabs">
      <div class="album-tab active" data-album="all" onclick="switchAlbum('all')">
        📁 全部 <span class="album-tab-count" id="count-all">0</span>
      </div>
    </div>

    <!-- 照片网格 -->
    <div class="photo-grid" id="photoGrid">
      <div class="empty-state" style="width: 100%;">
        <div class="empty-state-icon">🖼️</div>
        <div class="empty-state-text">还没有照片，上传第一张吧</div>
        <button class="btn btn-primary btn-lg" onclick="uploadPhotos()">
          📷 上传照片
        </button>
      </div>
    </div>
  </div>

  <!-- 图片查看器 -->
  <div class="viewer-overlay" id="viewerOverlay" onclick="closeViewer(event)">
    <button class="viewer-nav viewer-prev" onclick="event.stopPropagation(); prevPhoto()">‹</button>
    <div class="viewer-content" onclick="event.stopPropagation()">
      <button class="viewer-close" onclick="closeViewer()">×</button>
      <div id="viewerMedia"></div>
      <div class="viewer-info" id="viewerInfo"></div>
    </div>
    <button class="viewer-nav viewer-next" onclick="event.stopPropagation(); nextPhoto()">›</button>
  </div>

  <!-- 新建相册模态框 -->
  <div class="modal-overlay" id="albumModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">新建相册</div>
        <button class="modal-close" onclick="closeAlbumModal()">×</button>
      </div>
      <div class="input-group">
        <label>相册名称</label>
        <input type="text" id="albumName" placeholder="请输入相册名称">
      </div>
      <div style="display: flex; gap: 12px; justify-content: flex-end;">
        <button class="btn btn-secondary" onclick="closeAlbumModal()">取消</button>
        <button class="btn btn-primary" onclick="createAlbum()">创建</button>
      </div>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">确认删除</div>
        <button class="modal-close" onclick="closeDeleteModal()">×</button>
      </div>
      <p style="color: var(--text-secondary); margin-bottom: 24px;">确定要删除这张照片/视频吗？删除后无法恢复。</p>
      <div style="display: flex; gap: 12px; justify-content: flex-end;">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
        <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script>
    let albums = [];
    let photos = [];
    let currentAlbum = 'all';
    let currentPhotoIndex = 0;
    let filteredPhotos = [];
    let deleteTargetId = null;
    let slideshowInterval = null;

    // 初始化
    async function init() {
      const settings = await getSettings();
      applyTheme(settings.theme || 'sweet-pink');

      await loadAlbums();
      await loadPhotos();
      renderAlbumTabs();
      renderPhotos();
    }

    // 加载相册分类
    async function loadAlbums() {
      albums = await getAlbums();
    }

    // 加载照片
    async function loadPhotos() {
      photos = await getPhotos('all');
    }

    // 渲染相册标签
    function renderAlbumTabs() {
      const container = document.getElementById('albumTabs');
      
      // 计算每个相册的照片数量
      const countMap = {};
      photos.forEach(p => {
        countMap[p.albumId] = (countMap[p.albumId] || 0) + 1;
      });
      countMap['all'] = photos.length;

      let html = `
        <div class="album-tab ${currentAlbum === 'all' ? 'active' : ''}" data-album="all" onclick="switchAlbum('all')">
          📁 全部 <span class="album-tab-count">${countMap['all'] || 0}</span>
        </div>
      `;

      albums.forEach(album => {
        html += `
          <div class="album-tab ${currentAlbum === album.id ? 'active' : ''}" data-album="${album.id}" onclick="switchAlbum('${album.id}')">
            📂 ${album.name} <span class="album-tab-count">${countMap[album.id] || 0}</span>
          </div>
        `;
      });

      html += `
        <div class="album-tab album-tab-add" onclick="showAlbumModal()">
          ➕ 新建相册
        </div>
      `;

      container.innerHTML = html;
    }

    // 切换相册
    function switchAlbum(albumId) {
      currentAlbum = albumId;
      renderAlbumTabs();
      renderPhotos();
    }

    // 渲染照片
    async function renderPhotos() {
      const container = document.getElementById('photoGrid');
      
      filteredPhotos = currentAlbum === 'all' 
        ? photos 
        : photos.filter(p => p.albumId === currentAlbum);

      // 按时间倒序
      filteredPhotos.sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));

      document.getElementById('photoCount').textContent = `共 ${filteredPhotos.length} 张`;

      if (filteredPhotos.length === 0) {
        container.classList.remove('masonry');
        container.innerHTML = `
          <div class="empty-state" style="width: 100%;">
            <div class="empty-state-icon">🖼️</div>
            <div class="empty-state-text">这个相册还没有照片</div>
            <button class="btn btn-primary btn-lg" onclick="uploadPhotos()">
              📷 上传照片
            </button>
          </div>
        `;
        return;
      }

      container.classList.add('masonry');
      container.innerHTML = '';
      
      for (let i = 0; i < filteredPhotos.length; i++) {
        const photo = filteredPhotos[i];
        const mediaPath = await getMediaPath(photo.filename, photo.type);
        
        const item = document.createElement('div');
        item.className = 'photo-item fade-in';
        item.style.animationDelay = `${i * 0.05}s`;
        item.onclick = () => openViewer(i);
        
        if (photo.type === 'video') {
          item.innerHTML = `
            <video src="file://${mediaPath}" muted></video>
            <div class="video-badge">▶️ 视频</div>
            <button class="photo-delete-btn" onclick="event.stopPropagation(); showDeleteModal(${photo.id})">🗑️</button>
            <div class="photo-overlay">
              <div class="photo-note">${photo.note || '点击查看'}</div>
              <div class="photo-date">${formatDate(photo.uploadedAt)}</div>
            </div>
          `;
        } else {
          item.innerHTML = `
            <img src="file://${mediaPath}" alt="照片" loading="lazy">
            <button class="photo-delete-btn" onclick="event.stopPropagation(); showDeleteModal(${photo.id})">🗑️</button>
            <div class="photo-overlay">
              <div class="photo-note">${photo.note || '点击查看'}</div>
              <div class="photo-date">${formatDate(photo.uploadedAt)}</div>
            </div>
          `;
        }
        
        container.appendChild(item);
      }
    }

    // 上传照片
    async function uploadPhotos() {
      const result = await openFileDialog({
        properties: ['openFile', 'multiSelections'],
        filters: [
          { name: '图片', extensions: ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'] }
        ]
      });

      if (result.canceled || !result.filePaths.length) return;

      const albumId = currentAlbum === 'all' ? 'daily' : currentAlbum;
      let successCount = 0;

      for (const filePath of result.filePaths) {
        const res = await uploadPhoto(filePath, albumId, '');
        if (res.success) successCount++;
      }

      showToast(`成功上传 ${successCount} 张照片 📷`, 'success');
      await loadPhotos();
      renderAlbumTabs();
      renderPhotos();
    }

    // 上传视频
    async function uploadVideos() {
      const result = await openFileDialog({
        properties: ['openFile', 'multiSelections'],
        filters: [
          { name: '视频', extensions: ['mp4', 'avi', 'mov', 'mkv', 'webm'] }
        ]
      });

      if (result.canceled || !result.filePaths.length) return;

      const albumId = currentAlbum === 'all' ? 'daily' : currentAlbum;
      let successCount = 0;

      for (const filePath of result.filePaths) {
        const res = await uploadVideo(filePath, albumId, '');
        if (res.success) successCount++;
      }

      showToast(`成功上传 ${successCount} 个视频 🎬`, 'success');
      await loadPhotos();
      renderAlbumTabs();
      renderPhotos();
    }

    // 打开查看器
    async function openViewer(index) {
      currentPhotoIndex = index;
      await showCurrentPhoto();
      document.getElementById('viewerOverlay').classList.add('active');
    }

    // 显示当前照片
    async function showCurrentPhoto() {
      const photo = filteredPhotos[currentPhotoIndex];
      if (!photo) return;

      const mediaPath = await getMediaPath(photo.filename, photo.type);
      const mediaContainer = document.getElementById('viewerMedia');
      const infoEl = document.getElementById('viewerInfo');

      if (photo.type === 'video') {
        mediaContainer.innerHTML = `<video src="file://${mediaPath}" controls autoplay></video>`;
      } else {
        mediaContainer.innerHTML = `<img src="file://${mediaPath}" alt="照片">`;
      }

      infoEl.textContent = `${photo.note || ''} ${photo.note ? '·' : ''} ${formatDate(photo.uploadedAt)}`;
    }

    // 关闭查看器
    function closeViewer(event) {
      if (event && event.target !== event.currentTarget) return;
      stopSlideshow();
      document.getElementById('viewerOverlay').classList.remove('active');
    }

    // 上一张
    async function prevPhoto() {
      currentPhotoIndex--;
      if (currentPhotoIndex < 0) currentPhotoIndex = filteredPhotos.length - 1;
      await showCurrentPhoto();
    }

    // 下一张
    async function nextPhoto() {
      currentPhotoIndex++;
      if (currentPhotoIndex >= filteredPhotos.length) currentPhotoIndex = 0;
      await showCurrentPhoto();
    }

    // 幻灯片播放
    function startSlideshow() {
      if (filteredPhotos.length === 0) {
        showToast('没有照片可以播放', 'info');
        return;
      }
      
      openViewer(0);
      
      if (slideshowInterval) clearInterval(slideshowInterval);
      
      slideshowInterval = setInterval(() => {
        nextPhoto();
      }, 3000);
      
      showToast('幻灯片播放中，点击关闭按钮停止', 'info');
    }

    // 停止幻灯片
    function stopSlideshow() {
      if (slideshowInterval) {
        clearInterval(slideshowInterval);
        slideshowInterval = null;
      }
    }

    // 显示新建相册模态框
    function showAlbumModal() {
      document.getElementById('albumModal').classList.add('active');
      document.getElementById('albumName').value = '';
      document.getElementById('albumName').focus();
    }

    // 关闭新建相册模态框
    function closeAlbumModal() {
      document.getElementById('albumModal').classList.remove('active');
    }

    // 创建相册
    async function createAlbum() {
      const name = document.getElementById('albumName').value.trim();
      if (!name) {
        showToast('请输入相册名称', 'error');
        return;
      }

      const result = await ipcRenderer.invoke('save-album', { name });
      if (result.success) {
        showToast('相册创建成功 📂', 'success');
        closeAlbumModal();
        await loadAlbums();
        renderAlbumTabs();
      } else {
        showToast('创建失败', 'error');
      }
    }

    // 显示删除确认
    function showDeleteModal(id) {
      deleteTargetId = id;
      document.getElementById('deleteModal').classList.add('active');
    }

    // 关闭删除确认
    function closeDeleteModal() {
      deleteTargetId = null;
      document.getElementById('deleteModal').classList.remove('active');
    }

    // 确认删除
    async function confirmDelete() {
      if (!deleteTargetId) return;
      
      const result = await deleteMedia(deleteTargetId);
      if (result.success) {
        showToast('已删除', 'success');
        closeDeleteModal();
        await loadPhotos();
        renderAlbumTabs();
        renderPhotos();
      } else {
        showToast('删除失败', 'error');
      }
    }

    // 锁定应用
    function lockApp() {
      stopSlideshow();
      window.location.href = 'login.html';
    }

    // 键盘事件
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('viewerOverlay').classList.contains('active')) return;
      
      if (e.key === 'ArrowLeft') prevPhoto();
      if (e.key === 'ArrowRight') nextPhoto();
      if (e.key === 'Escape') closeViewer();
    });

    // 启动
    init();
  </script>
