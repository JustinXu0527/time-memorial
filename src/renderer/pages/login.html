<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光纪念册 - 登录</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffeef2 0%, #fff5f7 50%, #ffe0ec 100%);
      position: relative;
      overflow: hidden;
    }

    /* 背景装饰 */
    .bg-decoration {
      position: absolute;
      border-radius: 50%;
      opacity: 0.3;
    }

    .bg-decoration:nth-child(1) {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      top: -100px;
      left: -100px;
      animation: float 6s ease-in-out infinite;
    }

    .bg-decoration:nth-child(2) {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      bottom: -50px;
      right: -50px;
      animation: float 5s ease-in-out infinite reverse;
    }

    .bg-decoration:nth-child(3) {
      width: 150px;
      height: 150px;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      top: 50%;
      right: 10%;
      animation: float 7s ease-in-out infinite;
    }

    /* 飘落的爱心 */
    .hearts {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      color: rgba(255, 107, 157, 0.4);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    .login-container {
      position: relative;
      z-index: 10;
      width: 420px;
      padding: 50px 40px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(255, 107, 157, 0.2);
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 10px;
      animation: heartBeat 2s ease-in-out infinite;
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .app-subtitle {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 40px;
    }

    .password-input {
      position: relative;
      margin-bottom: 30px;
    }

    .password-input input {
      width: 100%;
      padding: 16px 50px 16px 20px;
      border: 2px solid #f0f0f0;
      border-radius: 50px;
      font-size: 16px;
      transition: var(--transition);
      background: white;
    }

    .password-input input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
    }

    .password-toggle {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      font-size: 18px;
      transition: var(--transition);
    }

    .password-toggle:hover {
      color: var(--primary);
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border-radius: 50px;
    }

    .setup-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
    }

    .setup-text {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 12px;
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
    }

    .welcome-text {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 25px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="bg-decoration"></div>
  <div class="bg-decoration"></div>
  <div class="bg-decoration"></div>
  
  <div class="hearts" id="hearts"></div>

  <div class="login-container fade-in">
    <div class="logo">💝</div>
    <h1 class="app-title">时光纪念册</h1>
    <p class="app-subtitle">记录每一个珍贵的瞬间</p>
    
    <div id="setupView" style="display: none;">
      <p class="welcome-text">
        欢迎使用时光纪念册！<br>
        为了保护你的隐私，请设置一个启动密码
      </p>
      <div class="password-input">
        <input type="password" id="newPassword" placeholder="请设置密码" maxlength="20">
        <button class="password-toggle" onclick="togglePassword('newPassword', this)">👁️</button>
      </div>
      <div class="password-input">
        <input type="password" id="confirmPassword" placeholder="请再次输入密码" maxlength="20">
        <button class="password-toggle" onclick="togglePassword('confirmPassword', this)">👁️</button>
      </div>
      <div class="error-msg" id="setupError"></div>
      <button class="btn btn-primary btn-lg login-btn" onclick="setupPassword()">
        设置密码并进入
      </button>
    </div>

    <div id="loginView">
      <p class="welcome-text">欢迎回来 💕<br>请输入密码进入你的时光纪念册</p>
      <div class="password-input">
        <input type="password" id="password" placeholder="请输入密码" maxlength="20" onkeypress="handleEnter(event)">
        <button class="password-toggle" onclick="togglePassword('password', this)">👁️</button>
      </div>
      <div class="error-msg" id="loginError"></div>
      <button class="btn btn-primary btn-lg login-btn" onclick="login()">
        进入时光纪念册
      </button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // 生成飘落爱心
    function createHearts() {
      const heartsContainer = document.getElementById('hearts');
      const heartEmojis = ['💕', '💗', '💖', '💝', '🌸', '✨'];
      
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
        heart.style.animationDelay = Math.random() * 5 + 's';
        heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
        heartsContainer.appendChild(heart);
      }
    }

    // 切换密码可见性
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    // 回车登录
    function handleEnter(event) {
      if (event.key === 'Enter') login();
    }

    // 检查是否已设置密码
    async function checkPassword() {
      const result = await ipcRenderer.invoke('check-has-password');
      if (result.hasPassword) {
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('setupView').style.display = 'none';
      } else {
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('setupView').style.display = 'block';
      }
    }

    // 设置密码
    async function setupPassword() {
      const pwd = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const errorEl = document.getElementById('setupError');

      if (!pwd) {
        errorEl.textContent = '请输入密码';
        return;
      }
      if (pwd.length < 4) {
        errorEl.textContent = '密码至少4位';
        return;
      }
      if (pwd !== confirm) {
        errorEl.textContent = '两次输入的密码不一致';
        return;
      }

      const result = await ipcRenderer.invoke('set-password', pwd);
      if (result.success) {
        window.location.href = 'index.html';
      } else {
        errorEl.textContent = '设置失败，请重试';
      }
    }

    // 登录
    async function login() {
      const pwd = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');

      if (!pwd) {
        errorEl.textContent = '请输入密码';
        return;
      }

      const result = await ipcRenderer.invoke('verify-password', pwd);
      if (result.success) {
        window.location.href = 'index.html';
      } else {
        errorEl.textContent = '密码错误，请重试';
        document.getElementById('password').value = '';
        document.getElementById('password').classList.add('shake');
        setTimeout(() => {
          document.getElementById('password').classList.remove('shake');
        }, 500);
      }
    }

    // 初始化
    createHearts();
    checkPassword();
  </script>
</body>
</html>
