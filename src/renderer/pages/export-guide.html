    const platformConfig = {

        name: '微信',
        icon: '💬',

    let currentPlatform = 'wechat';

    // 初始化
    async function init() {
      const settings = await getSettings();
      applyTheme(settings.theme || 'sweet-pink');

      // 配置 marked 渲染
      if (typeof marked !== 'undefined') {
        marked.setOptions({
          breaks: true,
          gfm: true,
          headerIds: false,
          mangle: false
        });
      }

      // 从 URL 参数读取平台
      const params = new URLSearchParams(window.location.search);
      const platformParam = params.get('platform');
      if (platformParam && platformConfig[platformParam]) {
        currentPlatform = platformParam;
      }

      switchPlatform(currentPlatform);
    }

    function switchPlatform(platform) {
      currentPlatform = platform;
      const config = platformConfig[platform];

      // 更新标签激活状态
      document.querySelectorAll('.platform-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.platform === platform);
      });

      // 更新教程网址
      const urlLink = document.getElementById('tutorialUrlLink');
      urlLink.href = config.url;
      urlLink.textContent = config.icon + ' ' + config.name + '教程网址：' + config.url;

      // 渲染 Markdown 内容
      const container = document.getElementById('guideContent');
      if (typeof marked !== 'undefined') {
        container.innerHTML = marked.parse(config.content);
      } else {
        container.innerHTML = '<p style="color:var(--text-light);">内容加载中...</p>';
      }

    // ========== 微信聊天记录导出方法 ==========
    platformConfig.wechat.content = `# 微信聊天记录导出方法

## 工具：PyWxDump

PyWxDump 是一款开源的微信聊天记录导出工具，基于 Python 开发，可以直接读取和解密本机微信的聊天记录数据库。

### 功能介绍

* 获取微信昵称、微信号、手机号、邮箱、数据库解密密钥
* 支持解密微信聊天记录数据库
* 支持导出聊天记录为 HTML、CSV 等格式
* 支持查看聊天记录中的图片、语音、视频等多媒体内容
* 支持多账户切换

### 使用步骤

#### 1. 安装 Python

首先需要在电脑上安装 Python 3.x 版本。建议从 [python.org](https://www.python.org/) 下载安装，安装时勾选"Add Python to PATH"。

#### 2. 安装 PyWxDump

打开命令提示符（CMD）或 PowerShell，执行以下命令：

\`\`\`shell
pip install pywxdump
\`\`\`

如果安装速度较慢，可以使用国内镜像源：

\`\`\`shell
pip install pywxdump -i https://pypi.tuna.tsinghua.edu.cn/simple
\`\`\`

#### 3. 确保微信已登录

在电脑上打开微信并保持登录状态，PyWxDump 需要读取正在运行中的微信进程内存来获取解密密钥。

> **注意：** 微信必须处于登录状态才能获取数据库密钥。如果微信未登录或刚关闭，请重新登录后再操作。

#### 4. 导出聊天记录

在命令提示符中执行：

\`\`\`shell
wxdump all
\`\`\`

此命令会自动获取微信信息、解密数据库并导出聊天记录。

你还可以单独使用以下命令：

\`\`\`shell
# 获取微信信息（昵称、账号、手机号、密钥等）
wxdump info

# 获取微信文件夹路径
wxdump db_path

# 解密微信数据库
wxdump decrypt -k <密钥> -i <数据库路径> -o <输出路径>

# 导出聊天记录为 HTML
wxdump export -u <微信账号> -o <导出路径> -msg <MSG.db路径> -micro <MicroMsg.db路径> -media <MediaMSG.db路径>
\`\`\`

#### 5. 导入到时光纪念册

导出完成后，在时光纪念册的「聊天记录」页面点击「导入聊天记录」，选择对应平台（微信），然后选择导出的 HTML 或 CSV 文件即可。

### 注意事项

* 本项目仅供学习交流和个人备份使用，请勿用于非法用途
* 所有读取和解析都在你自己的电脑上完成，不会上传数据到任何服务器
* 如果遇到问题，可以在项目 Gitee 页面提交 Issues
`;

## 工具：qq-chat-exporter (QCE)

这是一个帮你把 QQ 聊天记录导出到本地的工具。把它下载到你自己的电脑上，就能直接读取并保存好友和群聊的记录。

它不仅可以导出 HTML、JSON、TXT 和 Excel 等各种你需要的格式，还可以将聊天中发过的图片、视频和表情文件一并下载到本地保存。最重要的是，所有读取和解析都在你自己的电脑上完成，项目没有服务器或数据传输，不会把你的聊天记录上传到任何地方。

### 快速开始

#### Windows 一键安装（推荐）

1. 从 [Releases 页面](https://github.com/shuakami/qq-chat-exporter/releases) 下载一键安装包并运行
2. 用 QQ 扫码登录
3. 打开 \`http://localhost:40653/qce\`，开始导出

#### Shell 模式（Windows / Linux）

1. 从 [Releases 页面](https://github.com/shuakami/qq-chat-exporter/releases) 下载对应平台的压缩包
2. 运行 \`launcher-user.bat\`（Windows）或 \`./launcher-user.sh\`（Linux）
3. 用 QQ 扫码登录，复制控制台输出的 Token
4. 打开 \`http://localhost:40653/qce\`

#### Docker 一键部署

适用于 macOS（含 Apple Silicon）、Linux、Windows，无需安装 QQ 客户端：

\`\`\`bash
git clone https://github.com/shuakami/qq-chat-exporter.git
cd qq-chat-exporter/docker
docker compose up -d

# 查看登录二维码与 Token
docker logs -f napcat-qce
\`\`\`

> **注意：** Apple Silicon (M1/M2/M3/M4) 通过 Rosetta 模拟运行，首次启动可能稍慢。

### 功能特性

* 支持导出为 HTML / JSON / TXT / Excel 格式
* 支持导出聊天中的图片、视频和表情文件
* 现代化 Web 查看器，可搜索和浏览聊天记录
* 会话导出和资源画廊功能
* 全部本地处理，不经过任何服务器

### 导入到时光纪念册

导出完成后，在时光纪念册的「聊天记录」页面点击「导入聊天记录」，选择 QQ 平台，然后选择导出的 HTML 或 JSON 文件即可。

### 注意事项

* 本工具仅用于导出**自己的**聊天记录备份，请勿用于非法用途
* QQ 可能随时更改协议导致工具失效
* 更多问题请参考项目 [文档](https://shuakami.github.io/qq-chat-exporter/)
`;

## 工具：douyin-chat-export

从抖音网页版完整导出私信聊天记录，提供本地 Web 界面浏览、搜索和导出功能。

直接调用抖音 IM 接口（protobuf）抓取，突破网页虚拟列表的滚动上限，可导出完整聊天历史。

### 功能亮点

**采集能力：**
* **完整历史** — 直接调用抖音 IM API（protobuf），突破虚拟列表滚动上限
* **增量更新** — 增量模式只抓新消息
* **多种消息类型** — 文本、表情包、图片、语音、视频、分享（视频/商品/直播）、一起看视频、引用回复、系统消息

**浏览功能（Vue 3 + FastAPI 内置界面）：**
* 无限滚动、全文搜索、搜索结果一键跳转到原消息
* 消息分组、引用回复区块、图片点击放大、语音/视频在线播放
* 5 套主题一键切换（暗色 / 微信绿 / 浅色 / 暖棕 / 紫夜），全中文界面

**媒体本地化：**
* 图片 AES-GCM 解密 + HEIC 自动转 JPEG
* 语音自动落地
* 视频 MPEG-CENC 解密 + faststart 转封装
* 可开关"新消息自动下载"与"回填历史媒体"

**导出 & 运维：**
* 导出 ChatLab 标准格式（JSON / JSONL），可直接做 AI 聊天分析
* Web 控制面板：可视化采集 / 导出 / 定时任务 / 远程扫码登录 / 密码保护
* 定时任务（cron）+ 失败推送到微信
* Docker 一键部署，数据持久化

### 快速开始（Docker 部署）

已安装 Docker 即可，无需 clone 仓库、无需本地构建。新建一个目录，保存以下内容为 \`docker-compose.yml\`：

\`\`\`yaml
services:
  douyin-chat-export:
    image: ghcr.io/teambreakerr/douyin-chat-export:latest
    container_name: douyin-chat-export
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
\`\`\`

然后执行：

\`\`\`bash
docker compose up -d
\`\`\`

> **国内拉取 ghcr.io 缓慢或超时？** 把 \`image:\` 里的 \`ghcr.io\` 换成 \`ghcr.nju.edu.cn\`（南京大学镜像代理），其余不变。

然后打开 \`http://localhost:8000/panel\` → **登录**（导入 Cookie 或远程扫码），采集完成后访问 \`http://localhost:8000\` 浏览。

### 登录方式（三选一）

1. **本地浏览器扫码** — 在宿主机运行登录脚本，弹出真实浏览器窗口扫码
2. **Cookie 导入（推荐）** — 在任意浏览器登录抖音后导出 Cookie，粘贴导入到控制面板
3. **控制面板远程扫码** — 通过截图远程操作容器内浏览器

登录态保存在 \`data/browser_profile/\`，经 volume 持久化。

### 采集与导出

在控制面板可视化操作（增量/全量切换、勾选会话、实时日志），或用命令行：

\`\`\`bash
# 采集
python3 extract.py                          # 全量采集所有会话
python3 extract.py --filter "会话名称"        # 只采集指定会话
python3 extract.py --filter "会话名称" --incremental   # 增量（只取新消息）

# 导出为 ChatLab 格式（可直接做 AI 分析）
python3 export.py --filter "会话名称"                    # JSONL（默认）
python3 export.py --filter "会话名称" --format json      # JSON
python3 export.py --filter "会话名称" --output data/export.jsonl
\`\`\`

### 导入到时光纪念册

导出完成后，在时光纪念册的「聊天记录」页面点击「导入聊天记录」，选择对应平台导入 JSON 文件即可。

### 注意事项

* 本工具仅用于导出**自己的**聊天记录备份，请勿用于非法用途
* 抖音可能随时更改接口导致工具失效
* 媒体 CDN URL 有签名有效期（约 1 年），过期后未本地化的图片/表情将无法显示
* 语音文件自动下载到本地，不受 CDN 过期影响
